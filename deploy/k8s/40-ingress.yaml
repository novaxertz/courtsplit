# HTTP entry point.
#
# The Service is ClusterIP, so it is unreachable from outside the cluster. The
# Ingress plus an ingress-nginx controller is what exposes it; the kind config
# maps container port 80 to host 8080, so this ends up at http://localhost:8080.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: courtsplit
  namespace: courtsplit
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: courtsplit-api
                port:
                  number: 80
---
# Expiry sweep as a CronJob.
#
# This replaces the in-process setInterval the API used to run, which the
# project README listed as a known limitation ("no dedicated task scheduler").
#
# Why it matters beyond tidiness: with the sweep running inside every API pod,
# scaling to 2 replicas meant two schedulers racing on the same bookings. The
# transitions are conditional writes so that was survivable, but it was
# duplicated work with no owner. As a CronJob there is exactly one runner, and
# the API becomes genuinely stateless.
#
# The sweep must still be safe to run concurrently with API traffic and with a
# slow previous run - which it is, because every transition matches on the
# booking still being PENDING_PAYMENT. concurrencyPolicy: Forbid is belt and
# braces on top of that, not a substitute for it.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: courtsplit-expiry-sweep
  namespace: courtsplit
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # If the cluster is busy and a scheduled run is missed by more than this, skip
  # it rather than firing late. Without a deadline, a controller outage produces
  # a thundering herd of catch-up runs the moment it recovers.
  startingDeadlineSeconds: 30
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          containers:
            - name: sweep
              image: courtsplit-api:local
              imagePullPolicy: Never
              command: ["node", "scripts/expiry-sweep.js"]
              envFrom:
                - configMapRef:
                    name: courtsplit-config
                - secretRef:
                    name: courtsplit-secrets
              resources:
                requests:
                  cpu: 25m
                  memory: 96Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
