apiVersion: v1
kind: Service
metadata:
  name: courtsplit-api
  namespace: courtsplit
  labels:
    app: courtsplit-api
spec:
  type: ClusterIP
  selector:
    app: courtsplit-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: courtsplit-api
  namespace: courtsplit
  labels:
    app: courtsplit-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: courtsplit-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never drop below the current replica count during a rollout, and add at
      # most one extra pod. With readiness wired to a real check, this means a
      # broken image cannot take the service down: the new pod never becomes
      # ready, so the old one is never removed and the rollout simply stalls.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: courtsplit-api
    spec:
      # Spread replicas across nodes where possible. ScheduleAnyway rather than
      # DoNotSchedule so a single-node cluster still schedules both pods
      # instead of leaving one Pending forever.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: courtsplit-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: courtsplit-api:local
          # kind loads images directly into the node, and there is no registry
          # to pull from. Never means "trust what is already on the node".
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: courtsplit-config
            - secretRef:
                name: courtsplit-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Liveness asks only "is the process alive". It must NOT check the
          # database: a failing liveness probe restarts the container, so tying
          # it to a dependency turns a brief database blip into a restart storm
          # across every replica simultaneously.
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness asks "can I serve right now", so it DOES check storage.
          # Failing it removes the pod from Service endpoints without killing
          # it, and the pod rejoins automatically once the database recovers.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # Startup probe covers slow first boots. While it is running the
          # liveness probe is suspended, so a cold start cannot be mistaken for
          # a hang: 30 x 2s = up to 60s to come up, then normal timings apply.
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 2
            failureThreshold: 30
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: courtsplit-api
  namespace: courtsplit
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: courtsplit-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          # Percentage of the *request* (50m), not the limit. The HPA needs
          # metrics-server to be installed or it reports <unknown> targets.
          type: Utilization
          averageUtilization: 70
